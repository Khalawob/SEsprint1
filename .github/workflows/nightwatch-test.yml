name: Nightwatch Test - Front Page Load

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:   # Manual trigger for the workflow

jobs:
  test:
    runs-on: ubuntu-latest  # Running on the latest Ubuntu environment

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'  # Specify the version of Node.js you want to use

    - name: Install dependencies
      run: npm install  # Install the necessary packages from your package.json

    - name: Install XVFB (for headless tests)
      run: sudo apt-get install -y xvfb  # Install xvfb for headless browser testing

    - name: Run Nightwatch Tests
      run: xvfb-run --auto-servernum npm test -- --env chrome  # Run tests using Nightwatch with Chrome
