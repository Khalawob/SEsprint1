name: Nightwatch Test - Front Page Load

on:
  push:
    branches:
      - master
  workflow_dispatch:  # Manual trigger for GitHub Actions workflow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  # Use your Node.js version here

      - name: Install dependencies
        run: |
          npm install
          npm install nightwatch selenium-server chromedriver --save-dev

      - name: Run Nightwatch tests
        run: npx nightwatch