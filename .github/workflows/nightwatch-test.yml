name: Nightwatch Test - Front Page Load

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set up Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'  # Adjust as needed

      # Install dependencies
      - name: Install Dependencies
        run: npm install

      # Start the application using Docker Compose
      - uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: "./docker-compose-deploy.yml"  # Change if needed

      # Optional: Wait for services to be ready
      - name: Wait for Web Application
        run: sleep 10  # Adjust if your app needs more time

      # Run Nightwatch tests
      - name: Run Nightwatch Tests
        run: npm test

      # Upload Nightwatch HTML report if it exists
      - name: Upload Test Report
        uses: actions/upload-artifact@v2
        with:
          name: nightwatch-report
          path: tests_output/nightwatch-html-report/index.html